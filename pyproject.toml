[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autocharging"
version = "0.1.0"
description = "Limita la carga de portatiles y telefonos con un enchufe inteligente Tuya"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["tinytuya>=1.13", "psutil>=5.9", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
autocharging = "autocharging.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
