[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autocharging"
version = "0.3.0"
description = "Limita la carga de portatiles y telefonos con un enchufe inteligente Tuya"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "python-dotenv>=1.0",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
tuya = ["tinytuya>=1.13"]            # enchufe Tuya por red local
local = ["psutil>=5.9"]              # leer la bateria del propio portatil
all = ["tinytuya>=1.13", "psutil>=5.9"]
dev = ["pytest>=7", "psutil>=5.9"]

[project.scripts]
autocharging = "autocharging.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
